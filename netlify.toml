# Netlify deploy config. Netlify detects Next.js and installs its own Next.js
# runtime automatically, so no plugin line is needed (listing the old
# @netlify/plugin-nextjs package by hand can break builds on current Netlify).

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"
  # Firebase web config values are PUBLIC by design (they ship inside the
  # browser JavaScript of every Firebase app; your Firestore security rules are
  # what protect the data). Netlify's secrets scanner would otherwise see them
  # in the built bundle and fail the deploy, so tell it to skip them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_DATABASE_URL,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID"
